<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>API Call Progress</title>
  <style>
    #top-progress-container {
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #progress-container {
      text-align: center;
    }

    #runner {
      width: 100px;
      height: 100px;
      background-image: url('https://cdn.pixabay.com/animation/2024/05/04/22/05/22-05-59-607_512.gif');
      background-size: cover;
      animation: run 5s infinite linear;
    }

    @keyframes run {
      0% {
        transform: translateX(-50px);
      }
      100% {
        transform: translateX(700px);
      }
    }

    #percentage {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
  <script>
    function startProgress(userId) {
      var elem = document.getElementById("percentage");
      var statusText = document.getElementById("status-text");
      let previousPercentage = 0; // 이전 퍼센티지 값을 저장할 변수

      // 2초마다 서버에 GET 요청을 보냅니다
      var id = setInterval(() => {
        fetch(`/demo/progress/${userId}`)
        .then(response => response.text())
        .then(percentage => {
          // 현재 값을 숫자로 변환
          percentage = parseInt(percentage);

          // 서버에서 받은 값을 percentage로 설정합니다
          elem.innerHTML = percentage + '%';

          // 퍼센티지가 줄어들면 상태 텍스트를 변경합니다
          if (percentage < previousPercentage) {
            statusText.innerHTML = "저장소 분석 완료 (DONE) \n 문서 생성중 \n ";
          }

          // 이전 값을 업데이트
          previousPercentage = percentage;

          // 퍼센티지가 100%에 도달하면 반복을 멈춥니다
          if (percentage >= 100) {
            clearInterval(id);
          }
        })
        .catch(error => console.error('Error:', error));
      }, 2000); // 2초마다 요청을 보냅니다
    }
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0,
            v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }
    function callApi() {
      var userId = generateUUID(); // 실제 사용자 ID로 변경 필요
      startProgress(userId);
      setTimeout(function () {
        window.location.href = "/demo/clone/"+userId+"?repoUrl=" + getUrlParameter('repoUrl');
      }); // 5초 대기 후 API 호출
    }

    function getUrlParameter(name) {
      name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
      var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
      var results = regex.exec(location.search);
      return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }
  </script>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,"/>

  <script src="https://unpkg.com/htmx.org@1.9.2"></script>
  <script src="/js/parameterPaser.js"></script>

  <!-- bootstrap cdn -->

</head>

<div>
  <div class="main-container">
    <div id="top-progress-container">
      <div id="progress-container">
        <h2 id="status-text">저장소 분석중</h2>
        <h4>API 문서를 생성하고 있습니다. 잠시만 기다려주세요.</h4>
        <p>체험하기에서는 3개의 API endpoint만 생성됩니다.</p>

        <div id="percentage">0%</div>
